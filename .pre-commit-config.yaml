default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py313-plus]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md, --markdown-linebreak-ext=qmd]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=5120]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-illegal-windows-names
      - id: check-symlinks
      - id: check-case-conflict
      - id: debug-statements
      - id: detect-private-key
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/ikamensh/flynt/
    rev: "1.0.6"
    hooks:
      - id: flynt

  - repo: https://github.com/yunojuno/pre-commit-xenon
    rev: cc59b0431a5d072786b59430e9b342b2881064f6
    hooks:
      - id: xenon
        args: [--max-average=C, --max-modules=C, --max-absolute=C]

  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.14
    hooks:
      - id: vulture
        exclude: ^tests/
        args: [--min-confidence, "80", --exclude, ".venv"]
        pass_filenames: true

  - repo: local
    hooks:
      - id: fix-future-annotations
        name: fix __future__ annotations placement
        entry: uv run python scripts/fix_future_annotations.py
        language: system
        pass_filenames: true
        files: \.py$

      - id: pytest
        name: pytest
        entry: uv run --all-groups pytest
        language: system
        pass_filenames: false

      - id: pip-audit
        name: pip-audit
        entry: uvx pip-audit
        language: system
        pass_filenames: false
        files: (pyproject\.toml|uv\.lock)$
