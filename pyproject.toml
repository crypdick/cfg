[project]
name = "cfg"
version = "0.1.0"
description = "Apply host and repository configuration from a separate personalization repository."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "pydantic",
    "pyinfra",
    "tomli-w>=1.2.0",
    "typer",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "flynt>=1.0.6",
    "mypy>=2.3.0",
    "prek>=0.4.10",
    "pyupgrade>=3.21.2",
    "ruff>=0.15.22",
    "vulture>=2.16",
]
test = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-timeout",
    "pytest-xdist",
]

[project.scripts]
cfg = "main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cfg*"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "A",
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN205",
    "ANN206",
    "ANN401",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "COM818",
    "C90",
    "D402",
    "D414",
    "D418",
    "D419",
    "DOC102",
    "DOC202",
    "DOC403",
    "DTZ",
    "E",
    "ERA",
    "EXE",
    "F",
    "FA",
    "FBT",
    "FLY",
    "FURB101",
    "FURB103",
    "FURB122",
    "FURB129",
    "FURB132",
    "FURB157",
    "FURB161",
    "FURB162",
    "FURB168",
    "FURB169",
    "FURB171",
    "FURB177",
    "FURB181",
    "FURB188",
    "G",
    "I",
    "INP",
    "ISC004",
    "LOG",
    "N",
    "PERF",
    "PGH",
    "PIE",
    "PLC",
    "PLE",
    "PLR0124",
    "PLR0133",
    "PLR0206",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR1702",
    "PLR1704",
    "PLR1711",
    "PLR1714",
    "PLR1716",
    "PLR1722",
    "PLR1733",
    "PLR1736",
    "PLR5501",
    "PLW",
    "PT",
    "PTH",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "T10",
    "T20",
    "TC",
    "TID",
    "TRY004",
    "TRY201",
    "TRY203",
    "TRY300",
    "TRY400",
    "TRY401",
    "UP",
    "W",
    "YTT",
]
ignore = [
    "E501",
    # Lazy imports isolate optional pyinfra/CLI dependencies and monkeypatch seams.
    "PLC0415",
    # Orchestration APIs are keyword-only; request objects would add indirection.
    "PLR0913",
    "S101",
    "S603",
    "S607",
    "TRY003",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN",
    "ARG",
    "C901",
    "FBT",
    "F841",
    "INP001",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "S101",
    "S106",
    "S108",
    "SLF",
    "T20",
]
"scripts/**/*.py" = [
    "BLE001",
    "C901",
    "PLR0912",
    "PLR0915",
    "S603",
    "S607",
    "T20",
    "INP001",
]
"main.py" = ["T20"]
"cfg/**/cli*.py" = ["T20"]
"cfg/**/app.py" = ["FBT", "T20"]
"cfg/**/*.py" = [
    "TC",
]
"cfg/pyinfra/**/*.py" = ["PLR0911", "PLR0912", "PLR0915", "PLR1702", "SLF001"]
"cfg/host/sync_repos.py" = ["PLR0911"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
strict_markers = true
strict_config = true
xfail_strict = true
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pyinfra.*",
    "ignore::DeprecationWarning:gevent.*",
]
addopts = [
    "--no-header",
    "-n",
    "auto",
    "-q",
    "--strict-markers",
    "--tb=short",
    "--durations=5",
    "--durations-min=1.0",
    "--cov=cfg",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--failed-first",
]
timeout = 20
timeout_method = "signal"

[tool.coverage.run]
branch = true
source = ["cfg"]
omit = [
    "tests/*",
]

[tool.coverage.report]
fail_under = 87
show_missing = true
skip_empty = true
exclude_also = [
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.vulture]
min_confidence = 80
paths = ["cfg"]
exclude = [".venv/"]
ignore_decorators = [
    "@app.command",
    "@features_app.command",
    "@managed_app.command",
    "@deploy",
    "@field_validator",
    "@model_validator",
]
ignore_names = [
    # Pydantic v2 config/validator conventions:
    "model_config",
    "cls",
    "schema_version",
    # Runtime/entrypoint patterns vulture can't see:
    "_USE_VFORK",
    "make_names_data",
    # Intentional side effects / global flags:
    "is_cli",
    "dont_write_bytecode",
]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["pyinfra.*"]
ignore_missing_imports = true
disable_error_code = ["attr-defined"]

[tool.deptry]
extend_exclude = ["scripts/prek_hooks"]

[tool.uv]
# Security measure: wait three days before resolving newly published releases.
exclude-newer = "3 days"
