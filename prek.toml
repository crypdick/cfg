minimum_prek_version = "0.3.2"
default_language_version.python = "python3.13"

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-json" },
    { id = "check-toml" },
    { id = "check-yaml" },
    { id = "check-merge-conflict" },
    { id = "detect-private-key" },
    { id = "check-added-large-files", args = ["--maxkb=5120"] },
    { id = "check-case-conflict" },
    { id = "check-symlinks" },
    { id = "destroyed-symlinks" },
    { id = "fix-byte-order-marker" },
    { id = "mixed-line-ending" },
    { id = "check-executables-have-shebangs" },
    { id = "check-shebang-scripts-are-executable" },
]

[[repos]]
repo = "https://github.com/Yelp/detect-secrets"
rev = "v1.5.0"
hooks = [
    { id = "detect-secrets", exclude = "(uv\\.lock|\\.pre-commit-config\\.yaml)" },
]

[[repos]]
repo = "https://github.com/jendrikseipp/vulture"
rev = "v2.14"
hooks = [
    { id = "vulture", args = [".", "--min-confidence", "80"], pass_filenames = false },
]

[[repos]]
repo = "https://github.com/asottile/pyupgrade"
rev = "v3.21.2"
hooks = [{ id = "pyupgrade", args = ["--py313-plus"] }]

[[repos]]
repo = "https://github.com/ikamensh/flynt"
rev = "1.0.6"
hooks = [{ id = "flynt" }]

[[repos]]
repo = "https://github.com/henryiii/validate-pyproject-schema-store"
rev = "2026.07.08"
hooks = [{ id = "validate-pyproject" }]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "Ruff check"
entry = "uv run ruff check --fix --quiet"
language = "system"
types = ["python"]

[[repos.hooks]]
id = "ruff-format"
name = "Ruff format"
entry = "uv run ruff format --quiet"
language = "system"
types = ["python"]

[[repos.hooks]]
id = "mypy"
name = "mypy"
entry = "uv run mypy cfg/"
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "deptry"
name = "deptry"
entry = "uv run deptry ."
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "check-private-test-imports"
name = "Forbid private imports in tests"
entry = "uv run python scripts/prek_hooks/check_private_test_imports.py"
language = "system"
types = ["python"]

[[repos.hooks]]
id = "fix-future-annotations"
name = "Fix future annotations"
entry = "uv run python scripts/prek_hooks/fix_future_annotations.py"
language = "system"
types = ["python"]

[[repos.hooks]]
id = "pip-audit"
name = "pip-audit"
entry = "uvx pip-audit"
language = "system"
pass_filenames = false
files = "(pyproject\\.toml|uv\\.lock)$"

[[repos.hooks]]
id = "pytest"
name = "pytest"
entry = "uv run --all-groups pytest"
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "cfg-repo-check"
name = "cfg repo check (staged)"
entry = "uv run cfg repo check --staged"
language = "system"
pass_filenames = false
always_run = true
